name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # T030.14B — see the matching job in backend-ci.yml for the full rationale: path detection
  # lives inside the workflow (job-level `if:`), not in the workflow-level trigger `paths:`
  # filter, so the `Frontend` aggregator job below always exists as a real check-run.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend-relevant changes
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base commit (first push, force-push, or new branch) — treating as changed."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files ($BASE...$HEAD):"
          echo "$CHANGED"

          # T032.03 — docs/api/openapi.json also counts as frontend-relevant even though it
          # lives outside frontend/: a backend-only change to the API contract must still
          # trigger the Orval drift-check below, or a stale generated client would go unnoticed.
          if echo "$CHANGED" | grep -qE '^frontend/|^\.github/workflows/frontend-ci\.yml$|^docs/api/openapi\.json$'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Lint · Typecheck · Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # T032.03 (RFC-T031 D10) — regenerates the Orval client from the committed
  # docs/api/openapi.json and typechecks the result. src/generated/ is gitignored (D11), so
  # there is no committed baseline to diff against by design — the meaningful invariant this
  # job protects instead is "the committed OpenAPI document still produces a client that
  # generates and typechecks cleanly against apiClientMutator/current TS strict settings",
  # not a byte-for-byte comparison against nothing.
  api-client-drift:
    name: API Client Drift
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate API client and check drift
        run: npm run check:api-client-drift

  # SPEC-T031 §26 — added at the same time the first real test file exists (RFC §30 D14),
  # not pre-provisioned as an empty/trivially-passing job ahead of that.
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

  # T031.06 — the required Playwright auth/session E2E test (playwright.config.ts is scoped
  # to e2e/auth only). Chromium only (no firefox/webkit) — this suite doesn't use them. The
  # config's own webServer block starts `next dev` and Playwright tears it down after the run
  # (reuseExistingServer is false in CI, so it always starts and always owns the shutdown).
  e2e-auth:
    name: Playwright Auth E2E
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright auth tests
        run: npm run test:e2e:auth

      # T031.08 — a retry (playwright.config.ts: retries: 2 in CI) may let this
      # race-sensitive test pass without ever needing one; if it DID need a retry,
      # that's real reliability evidence and must stay visible, not be silently
      # dropped just because the job is otherwise green.
      - name: Check for flaky Playwright results
        id: flaky_check
        if: always()
        working-directory: frontend
        shell: bash
        run: |
          if [ -f playwright-report/results.json ] && grep -q '"status":"flaky"' playwright-report/results.json; then
            echo "::warning::T031.08: at least one Playwright test passed only after a retry (flaky) — see the uploaded playwright-report artifact for details."
            echo "flaky=true" >> "$GITHUB_OUTPUT"
          else
            echo "flaky=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        if: failure() || steps.flaky_check.outputs.flaky == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # T030.14B — required aggregator check. Named exactly "Frontend" to match the repository
  # ruleset's required_status_checks context. Always runs (`if: always()`); never reports
  # success on account of a job being skipped due to an upstream failure.
  Frontend:
    name: Frontend
    needs: [changes, ci, test, e2e-auth, api-client-drift]
    if: always()
    runs-on: ubuntu-latest
    # No checkout step — this job only reads `needs.*` context, so the workflow-level
    # `defaults.run.working-directory: frontend` (which doesn't exist without a checkout)
    # must be overridden here, or the shell fails to start at all.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Evaluate frontend CI result
        shell: bash
        run: |
          echo "changes.result=${{ needs.changes.result }}"
          echo "changes.outputs.frontend=${{ needs.changes.outputs.frontend }}"
          echo "ci.result=${{ needs.ci.result }}"
          echo "test.result=${{ needs.test.result }}"
          echo "e2e-auth.result=${{ needs['e2e-auth'].result }}"
          echo "api-client-drift.result=${{ needs['api-client-drift'].result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Path-detection job did not succeed — failing safe, cannot determine relevance."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.frontend }}" != "true" ]; then
            echo "No frontend-relevant changes in this diff — trivially passing."
            exit 0
          fi

          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "Lint/Typecheck/Build did not succeed (result: ${{ needs.ci.result }})."
            exit 1
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test suite did not succeed (result: ${{ needs.test.result }})."
            exit 1
          fi

          if [ "${{ needs['e2e-auth'].result }}" != "success" ]; then
            echo "Playwright auth E2E did not succeed (result: ${{ needs['e2e-auth'].result }})."
            exit 1
          fi

          if [ "${{ needs['api-client-drift'].result }}" != "success" ]; then
            echo "API client drift check did not succeed (result: ${{ needs['api-client-drift'].result }})."
            exit 1
          fi

          echo "All required frontend checks succeeded."
